<style>
:root{box-sizing:border-box;--ink:#4a2f1f;--red:#D9261C;--cream:#F7EBD3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#FBEBCF;font-family:Fraunces,Georgia,serif;color:var(--ink)}
#sp{height:1600vh}
#w{position:fixed;inset:0;overflow:hidden;background:#FBEBCF}
#w svg{display:block;width:100%;height:100%}
.t{font:italic 500 22px Fraunces,Georgia,serif;fill:#5a3a28;stroke:#F7EBD3;stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.sg{font:600 19px Fraunces,Georgia,serif;fill:#4a2f1f}
#txt,#fin{position:fixed;left:6vw;top:calc(6vh + env(safe-area-inset-top,0px));max-width:min(88vw,520px);pointer-events:none}
#txt i,#fin p{display:block;margin:0;font:italic 500 clamp(15px,2vw,20px)/1.3 Fraunces,Georgia,serif}
#txt h2,#fin h2{margin:.1em 0 .3em;font:600 clamp(34px,6.5vw,68px)/1 Fraunces,Georgia,serif;color:var(--red)}
#cap{transition:opacity .35s;margin-top:.8em;min-height:5em}
#cap em{display:block;font:600 clamp(20px,2.6vw,26px) Fraunces,Georgia,serif;color:var(--red);font-style:normal}
#cap b{display:block;font:600 clamp(22px,3vw,32px)/1.1 Fraunces,Georgia,serif}
#cap span{font:italic 500 clamp(15px,2vw,19px) Fraunces,Georgia,serif}
#fin{opacity:0}
#fin a{display:inline-block;margin-top:.6em;background:var(--red);color:var(--cream);padding:.85em 1.5em;border-radius:99px;text-decoration:none;font:600 15px system-ui,sans-serif}
#fin a:focus-visible{outline:3px solid #F4C430;outline-offset:3px}
#bt{position:fixed;left:0;right:0;bottom:calc(2vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#rt{display:flex;align-items:center;gap:6px;font:italic 500 13px Fraunces,Georgia,serif;background:rgba(247,235,211,.85);padding:5px 14px;border-radius:99px}
#rt span{opacity:.45;transition:opacity .4s,color .4s}#rt span.on{opacity:1;color:var(--red);font-weight:600}#rt s{width:18px;border-top:2px dashed #8a5a3b;opacity:.5}
#dt{display:flex;gap:3px;background:rgba(247,235,211,.85);padding:5px 10px;border-radius:99px}
#dt svg{width:15px;height:15px}#dt path{fill:none;stroke:#8a5a3b;stroke-width:1.5;opacity:.5;transition:fill .4s,opacity .4s}#dt .on path{fill:var(--red);stroke:var(--red);opacity:1}
#hint{position:fixed;bottom:15vh;left:0;right:0;text-align:center;font:italic 500 16px Fraunces,Georgia,serif;pointer-events:none}
#cap a.loc{display:inline-block;padding:.45em .15em;font:italic 500 clamp(15px,2vw,18px) Fraunces,Georgia,serif;color:var(--red);text-decoration:underline;text-underline-offset:4px;pointer-events:auto;white-space:nowrap}
#txt,#fin{text-shadow:0 0 10px rgba(251,235,207,.95),0 0 3px rgba(251,235,207,.95)}
#fin a{text-shadow:none}
#txt h2,#fin h2{font-size:clamp(34px,min(6.5vw,8.5vh),68px)}
#cap b{font-size:clamp(20px,min(2.6vw,3.8vh),30px)}
#hint{left:6vw;right:auto;bottom:16vh;top:auto;text-align:left}
#cap{max-width:none}
@media (max-aspect-ratio:4/5){#hint{top:31vh;bottom:auto}}
@media (min-width:700px){#cap b{white-space:nowrap}}
#cap a.loc:focus-visible{outline:3px solid #F4C430;outline-offset:3px;border-radius:4px}
@keyframes sw{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#txt.sw>*{animation:sw .55s ease backwards}
.pl{font:italic 500 15px Fraunces,Georgia,serif;fill:#5a3a28;stroke:#E3EDDB;stroke-width:4;paint-order:stroke;stroke-linejoin:round}
.sl{font:italic 500 13px Fraunces,Georgia,serif;fill:#6d8f86}
#fin .st{display:flex;align-items:baseline;gap:.55em;margin:.1em 0;font:600 clamp(22px,3vw,30px)/1.25 Fraunces,Georgia,serif}
#fin .st b{color:var(--red);font-weight:600}#fin .st u{text-decoration:none;opacity:.45}
#fin .st+.st+.st{margin-bottom:.3em}
#txt h2 .lgt{display:block;height:1.75em;width:auto;margin:.08em 0;border-radius:.16em;box-shadow:0 3px 10px rgba(90,58,40,.25)}
#cap b .lgs{height:1.05em;width:auto;vertical-align:-.17em;margin-right:.4em;border-radius:.2em}
@media (prefers-reduced-motion:reduce){#txt.sw>*{animation:none}}
