<style>
:root{box-sizing:border-box;--ink:#4a2f1f;--red:#D9261C;--cream:#F7EBD3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#FBEBCF}
body{background:radial-gradient(ellipse 60% 55% at 50% 32%,#FFF3BF 0,#FBEBCF 70%);font-family:Fraunces,Georgia,serif;color:var(--ink)}
#bt{pointer-events:none;position:fixed;top:0;left:0;width:100%;height:clamp(50px,9vh,90px)}
.cl{position:fixed;height:34px;width:130px;background:#fff;border-radius:34px;opacity:.7;animation:dr 70s linear infinite}
.cl:before{content:"";position:absolute;left:24px;top:-18px;width:56px;height:56px;border-radius:50%;background:#fff}
@keyframes dr{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
#sc{pointer-events:none;z-index:1;position:fixed;left:0;bottom:0;width:100%;height:clamp(230px,42vh,440px)}
.hero{position:fixed;z-index:2;top:0;left:0;right:0;bottom:clamp(230px,34vh,360px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(24px,5vh,56px) 6vw 18px;box-sizing:border-box;overflow:hidden}
.hero>*{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
.hero>*:nth-child(2){animation-delay:.12s}.hero>*:nth-child(3){animation-delay:.24s}.hero>*:nth-child(4){animation-delay:.36s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.hero img{display:block;width:clamp(72px,min(13vw,16vh),150px);height:auto;max-height:18vh;object-fit:contain;border-radius:18px;box-shadow:0 7px 0 rgba(120,50,20,.14);flex:0 0 auto}
h1{margin:clamp(10px,1.8vh,18px) 0 clamp(6px,1vh,10px);font:600 clamp(24px,min(4.8vw,6.5vh),54px)/1.04 Fraunces,Georgia,serif;max-width:13em}
.hero p{margin:0 0 clamp(14px,2.2vh,24px);font:italic 500 clamp(14px,1.8vw,19px)/1.25 Fraunces,Georgia,serif;max-width:34em}
.go{display:inline-block;background:var(--red);color:var(--cream);padding:.82em 1.7em;border-radius:99px;text-decoration:none;font:600 clamp(14px,1.5vw,17px) system-ui,sans-serif;box-shadow:0 5px 0 #9b1c14;transition:transform .15s,box-shadow .15s;flex:0 0 auto}
.go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #9b1c14}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #9b1c14}
.go:focus-visible{outline:3px solid #F4C430;outline-offset:4px}
.sw{transform-origin:600px 246px;animation:sw 3.2s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (max-height:620px){
.hero{bottom:clamp(190px,30vh,260px);padding-top:18px;padding-bottom:12px}
.hero img{width:clamp(64px,12vh,92px);max-height:14vh}
h1{font-size:clamp(22px,5.2vh,34px);margin:8px 0 5px}
.hero p{font-size:14px;margin-bottom:12px}
.go{font-size:14px;padding:.72em 1.45em}
}
@media (max-width:520px){
.hero{padding-left:8vw;padding-right:8vw}
h1{max-width:11em}
}
@media (prefers-reduced-motion:reduce){.cl,.sw,.hero>*{animation:none}}
